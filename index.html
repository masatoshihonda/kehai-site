<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KEHAI</title>
<meta name="description" content="KEHAI (気配): a sense of presence, before you can see it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Shippori+Mincho:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100svh;
    color: #fbf6ee;
    background: #9a7450;
    font-family: "Jost", "Futura", "Century Gothic", sans-serif;
    font-weight: 400;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- the table: warm oak, fine grain, window light, and the shadow of something just out of frame --- */
  .scene { position: fixed; inset: 0; overflow: hidden; }
  .scene .base { position: absolute; inset: 0;
    background: linear-gradient(100deg, #cfab80 0%, #b48b62 38%, #94704c 70%, #7a5a3c 100%); }
  .scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .scene .grain  { mix-blend-mode: multiply; opacity: .5; }
  .scene .fibre  { mix-blend-mode: soft-light; opacity: .35; }
  .scene .light  { position: absolute; inset: 0;
    background: radial-gradient(70% 60% at 18% 12%, rgba(255,240,215,.42), transparent 70%); }
  .scene .shadow { position: absolute; width: 95vmax; height: 95vmax; right: -38vmax; bottom: -48vmax;
    border-radius: 50%; background: rgba(48,28,14,.42); filter: blur(60px);
    animation: breathe 14s ease-in-out infinite alternate; }
  .scene .edge   { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(35,20,10,.4)); }
  @keyframes breathe { from { transform: translate(0,0) scale(1); } to { transform: translate(-2vmax,-1.5vmax) scale(1.03); } }

  /* --- layout --- */
  .page {
    position: relative;
    min-height: 100vh; min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(24px, 4.5vw, 56px) clamp(24px, 6vw, 80px);
    text-shadow: 0 1px 18px rgba(45,25,10,.3);
  }
  header, footer { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .logo { font-weight: 500; font-size: clamp(30px, 4.4vw, 44px); letter-spacing: .03em; line-height: 1; }
  .tag  { font-size: 13px; font-weight: 300; letter-spacing: .08em; opacity: .85; }
  .tag b { font-family: "Shippori Mincho", serif; font-weight: 400; margin-right: 10px; letter-spacing: .1em; }

  .poem {
    align-self: center;
    justify-self: end;
    display: flex;
    flex-direction: row-reverse;
    align-items: flex-start;
    gap: clamp(28px, 5vw, 72px);
    margin: 8vh 0;
  }
  .jp {
    writing-mode: vertical-rl;
    font-family: "Shippori Mincho", serif;
    font-size: clamp(20px, 2.6vw, 28px);
    letter-spacing: .28em;
    line-height: 1.9;
    white-space: pre;
  }
  .en-wrap { padding-top: clamp(40px, 9vh, 110px); max-width: 380px; }
  .label { font-size: 11px; font-weight: 400; letter-spacing: .3em; text-transform: uppercase; opacity: .75; margin-bottom: 22px; }
  .en {
    font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 300;
    font-size: clamp(24px, 3.2vw, 34px); line-height: 1.32; white-space: pre-line;
  }
  .poet { margin-top: 22px; font-size: 13px; font-weight: 300; letter-spacing: .1em; opacity: .85; }
  .poet::before { content: ""; display: inline-block; width: 28px; height: 1px; background: currentColor; vertical-align: middle; margin-right: 12px; opacity: .7; }

  footer { font-size: 12px; font-weight: 300; letter-spacing: .12em; opacity: .8; }
  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(251,246,238,.4); padding-bottom: 2px; }
  footer a:hover { border-color: currentColor; }

  .fade { opacity: 0; transform: translateY(8px); animation: in 1.6s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .2s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.2s }
  @keyframes in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; transform: none; } .scene .shadow { animation: none; } }

  @media (max-width: 640px) {
    .poem { justify-self: start; flex-direction: column; gap: 28px; }
    .jp { writing-mode: horizontal-tb; letter-spacing: .14em; font-size: 18px; white-space: normal; }
    .en-wrap { padding-top: 0; }
  }
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="base"></div>
  <svg class="grain" preserveAspectRatio="none" viewBox="0 0 1000 1000">
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0035 0.11" numOctaves="5" seed="11"/>
      <feColorMatrix values="0 0 0 0 .32  0 0 0 0 .18  0 0 0 0 .08  0 0 0 1.6 -.45"/>
    </filter>
    <rect width="1000" height="1000" filter="url(#g)"/>
  </svg>
  <svg class="fibre" preserveAspectRatio="none" viewBox="0 0 1000 1000">
    <filter id="f" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .35  0 0 0 0 .2  0 0 0 .9 0"/>
    </filter>
    <rect width="1000" height="1000" filter="url(#f)"/>
  </svg>
  <div class="light"></div>
  <div class="shadow"></div>
  <div class="edge"></div>
</div>

<div class="page">
  <header class="fade">
    <h1 class="logo">KEHAI</h1>
    <p class="tag"><b>気配</b>a sense of presence</p>
  </header>

  <section class="poem" aria-live="polite">
    <p class="jp fade d1" id="jp" lang="ja"></p>
    <div class="en-wrap fade d2">
      <p class="label" id="label">Today</p>
      <p class="en" id="en"></p>
      <p class="poet" id="poet"></p>
    </div>
  </section>

  <footer class="fade d3">
    <span>&copy; <span id="year"></span> Kehai</span>
  </footer>
</div>

<script>
{
const HAIKU = {
  spring: [
    { jp: "梅一輪　一輪ほどの　暖かさ", en: "One plum blossom—\njust that much\nwarmth.", poet: "Hattori Ransetsu", poetJp: "服部嵐雪", note: "Spring is not here yet. One flower is enough to feel it coming." },
    { jp: "古池や　蛙飛びこむ　水の音", en: "The old pond—\na frog leaps in,\nthe sound of water.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "A single sound, and the silence that was there all along becomes audible." },
    { jp: "山路来て　何やらゆかし　すみれ草", en: "Coming along the mountain path—\nsomething draws me:\nwild violets.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "He feels the pull before he sees what it is." },
    { jp: "春の海　終日のたり　のたりかな", en: "The spring sea—\nall day long it rises and falls,\nrises and falls.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "Slow, steady motion you sense more than watch." },
    { jp: "菜の花や　月は東に　日は西に", en: "Fields of rapeseed—\nthe moon in the east,\nthe sun in the west.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "A moment poised between two states." },
    { jp: "雪とけて　村いっぱいの　子どもかな", en: "The snow melts—\nand the whole village\nfills with children.", poet: "Kobayashi Issa", poetJp: "小林一茶", note: "Conditions shift, and everything that was waiting comes out at once." },
    { jp: "さまざまの　事おもひ出す　桜かな", en: "So many things\nthey call to mind—\ncherry blossoms.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "The past is present in the flowers." },
    { jp: "春雨や　物語りゆく　蓑と傘", en: "Spring rain—\ntalking as they go,\na straw cape and an umbrella.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "We never see the two people. We only sense them through what they carry." },
    { jp: "白梅に　明くる夜ばかりと　なりにけり", en: "Now every night\nends in a dawn\nof white plum blossom.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "The season turning, felt in the quality of the light." },
    { jp: "春風や　闘志いだきて　丘に立つ", en: "Spring wind—\nI stand on the hill\nwith fight in my heart.", poet: "Takahama Kyoshi", poetJp: "高浜虚子", note: "Inner resolve meeting the first warm wind." }
  ],
  summer: [
    { jp: "閑さや　岩にしみ入る　蝉の声", en: "Such stillness—\nseeping into the rocks,\nthe cicadas' cry.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Loud sound, and yet what you feel is the stillness." },
    { jp: "夏草や　兵どもが　夢の跡", en: "Summer grass—\nall that remains\nof warriors' dreams.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Nothing is visible, but the presence of the past is everywhere." },
    { jp: "涼風の　曲りくねって　来たりけり", en: "The cool breeze\nwinding and twisting\nhas found its way here.", poet: "Kobayashi Issa", poetJp: "小林一茶", note: "You can feel the path the air took to reach you." },
    { jp: "牡丹散りて　打ちかさなりぬ　二三片", en: "The peony has fallen—\npetals lie on one another,\ntwo or three.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "A small sign that something large has just happened." },
    { jp: "五月雨や　大河を前に　家二軒", en: "Early-summer rains—\nfacing the swollen river,\ntwo houses.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "The pressure of the water, felt before anything breaks." },
    { jp: "夕立や　草葉をつかむ　むら雀", en: "Sudden evening shower—\nclutching the blades of grass,\na flock of sparrows.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "The birds sensed the storm before it arrived." },
    { jp: "不二ひとつ　うづみ残して　若葉かな", en: "Leaving only Fuji\nunburied—\nyoung green leaves.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "A whole landscape changing at once, around one fixed point." },
    { jp: "蛸壺や　はかなき夢を　夏の月", en: "Octopus traps—\nfleeting dreams\nunder the summer moon.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Something is coming that the dreamer cannot sense." },
    { jp: "六月を　奇麗な風の　吹くことよ", en: "June—\nhow clean the wind is\nas it blows.", poet: "Masaoka Shiki", poetJp: "正岡子規", note: "Nothing to see. Only a wind that feels different." }
  ],
  autumn: [
    { jp: "秋深き　隣は何を　する人ぞ", en: "Deep autumn—\nmy neighbour,\nwhat does he do?", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Someone is there, just beyond the wall, unseen but felt." },
    { jp: "此道や　行く人なしに　秋の暮", en: "This road—\nno one walks it\nthis autumn evening.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Absence can be felt as strongly as presence." },
    { jp: "物言へば　唇寒し　秋の風", en: "When I speak,\nmy lips go cold—\nthe autumn wind.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "The season announces itself on the skin." },
    { jp: "柿くへば　鐘が鳴るなり　法隆寺", en: "I bite into a persimmon—\na bell rings out\nfrom Hōryū-ji.", poet: "Masaoka Shiki", poetJp: "正岡子規", note: "Two small events, and a whole place comes alive around them." },
    { jp: "桐一葉　日当りながら　落ちにけり", en: "One paulownia leaf\nfalls,\nstill in the sunlight.", poet: "Takahama Kyoshi", poetJp: "高浜虚子", note: "A single leaf, and you know the season has turned." },
    { jp: "白露や　茨の刺に　ひとつづつ", en: "White dew—\non every thorn of the briar,\none drop each.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "The cold of the night, made visible one point at a time." },
    { jp: "石山の　石より白し　秋の風", en: "Whiter than the stones\nof Stone Mountain—\nthe autumn wind.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Wind has no colour, yet he feels it as white." },
    { jp: "荒海や　佐渡に横たふ　天河", en: "Rough sea—\nstretching out over Sado,\nthe River of Heaven.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Vast forces, sensed in the dark." },
    { jp: "朝顔に　釣瓶とられて　もらひ水", en: "The morning glory\nhas taken my well bucket—\nI borrow water.", poet: "Kaga no Chiyo-jo", poetJp: "加賀千代女", note: "She notices a delicate life and adjusts around it." },
    { jp: "名月を　取ってくれろと　泣く子かな", en: "“Get me that harvest moon!”\ncries\nthe child.", poet: "Kobayashi Issa", poetJp: "小林一茶", note: "So present it feels within reach." },
    { jp: "山は暮れて　野は黄昏の　芒かな", en: "The mountains in darkness,\nthe fields still at dusk—\npampas grass.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "Night arriving at different speeds across one view." },
    { jp: "鶏頭の　十四五本も　ありぬべし", en: "Cockscombs—\nthere must be\nfourteen or fifteen.", poet: "Masaoka Shiki", poetJp: "正岡子規", note: "Written from his sickbed. He senses the flowers he cannot fully see." }
  ],
  winter: [
    { jp: "斧入れて　香におどろくや　冬木立", en: "Striking with the axe—\nstartled by the scent:\nthe winter grove.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "Trees that looked dead were full of life inside." },
    { jp: "いくたびも　雪の深さを　尋ねけり", en: "Again and again\nI ask how deep\nthe snow has grown.", poet: "Masaoka Shiki", poetJp: "正岡子規", note: "Unable to leave his bed, he feels the snow through others." },
    { jp: "遠山に　日の当りたる　枯野かな", en: "On the far mountains\nsunlight rests—\nwithered fields.", poet: "Takahama Kyoshi", poetJp: "高浜虚子", note: "Warmth that is there, though not yet where you are." },
    { jp: "是がまあ　つひの栖か　雪五尺", en: "So this, then,\nis my final home—\nfive feet of snow.", poet: "Kobayashi Issa", poetJp: "小林一茶", note: "The weight of a place, felt all at once." },
    { jp: "葱買うて　枯木の中を　帰りけり", en: "Having bought leeks,\nI walk home\nthrough the bare trees.", poet: "Yosa Buson", poetJp: "与謝蕪村", note: "Quiet cold, and the warmth of home ahead." },
    { jp: "初しぐれ　猿も小蓑を　ほしげなり", en: "First winter rain—\neven the monkey seems to want\na little straw coat.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "The first cold rain, sensed in another creature." },
    { jp: "凩の　果はありけり　海の音", en: "The winter gale\ndoes have an end—\nthe sound of the sea.", poet: "Ikenishi Gonsui", poetJp: "池西言水", note: "You hear where the wind goes, though you cannot see it." },
    { jp: "水仙や　白き障子の　とも映り", en: "Narcissus—\nand the white paper screen\nreflecting each other.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "Two quiet presences brightening one room." },
    { jp: "冬の日や　馬上に氷る　影法師", en: "Winter sun—\nfrozen on horseback,\nmy shadow.", poet: "Matsuo Bashō", poetJp: "松尾芭蕉", note: "The cold made visible in a shadow." }
  ]
};



const now = new Date();
const m = now.getMonth();
const season = m >= 1 && m <= 3 ? "spring" : m >= 4 && m <= 6 ? "summer" : m >= 7 && m <= 9 ? "autumn" : "winter";
const day = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
const list = HAIKU[season];
const h = list[day % list.length];
document.getElementById("jp").textContent = h.jp.replace(/\u3000/g, "\n");
document.getElementById("en").textContent = h.en;
document.getElementById("poet").textContent = h.poet;
document.getElementById("label").textContent = "Today \u00b7 " + now.toLocaleDateString("en-GB", { day: "numeric", month: "long" });
document.getElementById("year").textContent = now.getFullYear();
}
</script>
</body>
</html>
